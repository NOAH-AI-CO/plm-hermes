server {
    listen 80;
    server_name _;
    client_max_body_size 50m;

    # The Client must not proxy browser traffic to the Server PLM engine.
    # Cross-boundary report APIs require a separately approved HTTPS gateway.
    location ~ ^/(plm_evidence_based|plm)(/|$) {
        return 404;
    }

    location / {
        proxy_pass http://hermes-webui:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }
}