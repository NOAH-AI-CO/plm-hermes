        form_content: |-
          ## 请核对自动抽取的病例信息

          {{#1790461961477.facts_markdown#}}

          如有需要，请在下方按 `字段: 值` 的格式补充或修改（每行一项；保持原样则留空）：

          {{#$output.user_edits#}}
        inputs:
        - default: { selector: [], type: constant, value: '' }
          output_variable_name: user_edits
          type: paragraph
        selected: false
        timeout: 3
        timeout_unit: day
        title: 人工介入
        type: human-input
        user_actions:
        - button_style: primary
          id: action_1
          title: 确认并继续
      height: 190
      id: '1790458324939'
      position: { x: 840, y: 120 }
      positionAbsolute: { x: 840, y: 120 }
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        code: "def main(patient_input: str, patient_info_json: str, patient_input_structured:\
          \ str, user_edits: str) -> dict:\n    import httpx, time, json, re\n\n \
          \   API_BASE = \"https://demo.noahai.co/api\"\n    TOKEN = \"3771967bfca7de823440b93c29c0fa04f0c8e1a2\"\
          \n    headers = {\"Authorization\": f\"Token {TOKEN}\", \"Content-Type\"\
          : \"application/json\"}\n\n    structured_fields = {}\n    if user_edits:\n\
          \        for raw in re.split(r\"[\\n；;]\", user_edits):\n            line\
          \ = raw.strip().strip(\"`\").strip()\n            m = re.match(r\"^([^:：=]+)\\\
          s*[:：=]\\s*(.+)$\", line)\n            if m:\n                structured_fields[m.group(1).strip()]\
          \ = m.group(2).strip()\n\n    body = {\"patient_input\": patient_input}\n\
          \    if patient_info_json:\n        try: body[\"confirmed_patient_info\"\
          ] = json.loads(patient_info_json)\n        except: pass\n    if patient_input_structured:\n\
          \        body[\"patient_input_structured\"] = patient_input_structured\n\
          \    if structured_fields:\n        body[\"structured_fields\"] = structured_fields\n\
          \n    resp = httpx.post(f\"{API_BASE}/plm_evidence_based/\", json=body,\
          \ headers=headers, timeout=30)\n    task_id = resp.json().get(\"data\",\
          \ {}).get(\"task_id\")\n    if not task_id:\n        return {\"result\"\
          : \"错误：未获取到 task_id\"}\n\n    for _ in range(120):\n        time.sleep(10)\n\
          \        poll = httpx.get(f\"{API_BASE}/execute_task/{task_id}/\", headers=headers,\
          \ timeout=30)\n        inner = poll.json().get(\"data\", {})\n        if\
          \ inner.get(\"task_status\") == \"complete\":\n            rj = inner.get(\"\
          result_json\", {})\n            if isinstance(rj, str): rj = json.loads(rj)\n\
          \            d = rj.get(\"data\", {})\n            if isinstance(d, str):\
          \ d = json.loads(d)\n            route = d.get(\"route\") or \"\"\n     \
          \       output = d.get(\"output\") or \"\"\n            if route == \"insufficient_case\"\
          :\n                mi = d.get(\"missing_information\") or []\n           \
          \     if mi: output += \"\\n\\n建议补充：\" + \"、\".join(mi)\n            return\
          \ {\"result\": output or \"无输出内容\"}\n        if inner.get(\"task_status\"\
          ) in (\"failed\", \"error\"):\n            return {\"result\": \"错误：诊疗任务失败\"\
          }\n    return {\"result\": \"错误：轮询超时\"}"
        code_language: python3
        desc: 阶段二：带卡片确认结果调主接口
        outputs:
          result: { children: null, type: string }
        selected: false
        title: 阶段二：带卡片
        type: code
        variables:
        - value_selector: ['1790458321384', query]
          value_type: string
          variable: patient_input
        - value_selector: ['1790461961477', patient_info_json]
          value_type: string
          variable: patient_info_json
        - value_selector: ['1790461961477', patient_input_structured]
          value_type: string
          variable: patient_input_structured
        - value_selector: ['1790458324939', user_edits]
          value_type: string
          variable: user_edits
      height: 80
