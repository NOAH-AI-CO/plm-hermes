    - data:
        code: "def main(patient_input: str, patient_input_structured: str) -> dict:\n\
          \    import httpx, time, json\n\n    API_BASE = \"https://demo.noahai.co/api\"\
          \n    TOKEN = \"3771967bfca7de823440b93c29c0fa04f0c8e1a2\"\n    headers\
          \ = {\"Authorization\": f\"Token {TOKEN}\", \"Content-Type\": \"application/json\"\
          }\n\n    body = {\"patient_input\": patient_input}\n    if patient_input_structured:\n\
          \        body[\"patient_input_structured\"] = patient_input_structured\n\
          \n    resp = httpx.post(f\"{API_BASE}/plm_evidence_based/\", json=body,\
          \ headers=headers, timeout=30)\n    task_id = resp.json().get(\"data\",\
          \ {}).get(\"task_id\")\n    if not task_id:\n        return {\"result\"\
          : \"错误：未获取到 task_id\"}\n\n    for _ in range(120):\n        time.sleep(10)\n\
          \        poll = httpx.get(f\"{API_BASE}/execute_task/{task_id}/\", headers=headers,\
          \ timeout=30)\n        inner = poll.json().get(\"data\", {})\n        if\
          \ inner.get(\"task_status\") == \"complete\":\n            rj = inner.get(\"\
          result_json\", {})\n            if isinstance(rj, str): rj = json.loads(rj)\n\
          \            d = rj.get(\"data\", {})\n            if isinstance(d, str):\
          \ d = json.loads(d)\n            route = d.get(\"route\") or \"\"\n     \
          \       output = d.get(\"output\") or \"\"\n            if route == \"insufficient_case\"\
          :\n                mi = d.get(\"missing_information\") or []\n           \
          \     if mi: output += \"\\n\\n建议补充：\" + \"、\".join(mi)\n            return\
          \ {\"result\": output or \"无输出内容\"}\n        if inner.get(\"task_status\"\
          ) in (\"failed\", \"error\"):\n            return {\"result\": \"错误：诊疗任务失败\"\
          }\n    return {\"result\": \"错误：轮询超时\"}"
        code_language: python3
