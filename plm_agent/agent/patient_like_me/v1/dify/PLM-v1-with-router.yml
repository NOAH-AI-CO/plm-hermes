      height: 109
      id: '1790458321384'
      position: { x: 0, y: 280 }
      positionAbsolute: { x: 0, y: 280 }
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        code: "def main(patient_input: str) -> dict:\n    import httpx, time, json\n\
          \n    API_BASE = \"https://demo.noahai.co/api\"\n    TOKEN = \"3771967bfca7de823440b93c29c0fa04f0c8e1a2\"\
          \n    headers = {\"Authorization\": f\"Token {TOKEN}\", \"Content-Type\"\
          : \"application/json\"}\n\n    fail = {\"facts_markdown\": \"\", \"patient_info_json\"\
          : \"\", \"patient_input_structured\": \"\", \"has_clear_diagnosis\": False,\
          \ \"facts_count\": 0, \"need_card\": False}\n\n    try:\n        resp =\
          \ httpx.post(f\"{API_BASE}/plm_evidence_based/extract-and-check/\",\n   \
          \                      json={\"patient_input\": patient_input},\n       \
          \                  headers=headers, timeout=30)\n        task_id = resp.json().get(\"\
          data\", {}).get(\"task_id\")\n    except Exception:\n        return fail\n\
          \    if not task_id:\n        return fail\n\n    for _ in range(60):\n \
          \       time.sleep(5)\n        try:\n            poll = httpx.get(f\"{API_BASE}/execute_task/{task_id}/\"\
          , headers=headers, timeout=30)\n            inner = poll.json().get(\"data\"\
          , {})\n        except Exception:\n            continue\n        if inner.get(\"\
          task_status\") == \"complete\":\n            rj = inner.get(\"result_json\"\
          , {})\n            if isinstance(rj, str): rj = json.loads(rj)\n       \
          \     d = rj.get(\"data\", {})\n            if isinstance(d, str): d = json.loads(d)\n\
          \            patient_info = d.get(\"patient_info\") or {}\n            facts\
          \ = d.get(\"facts\") or []\n            has_clear = bool(patient_info.get(\"\
          has_clear_diagnosis\", False))\n            filled_count = sum(1 for f in\
          \ facts if f.get(\"source\") in (\"system_extracted\", \"user_input\") and\
          \ f.get(\"value\"))\n            need_card = has_clear and filled_count\
          \ >= 3\n\n            if facts:\n                src_map = {\"user_input\"\
          : \"人工输入\", \"system_extracted\": \"图谱提取\", \"missing\": \"未填写\"}\n     \
          \           lines = [\"| 字段 | 当前值 | 来源 | 必填 |\", \"|---|---|---|---|\"\
          ]\n                for f in facts:\n                    label = f.get(\"\
          label\", \"\") or f.get(\"key\", \"\")\n                    value = f.get(\"\
          value\", \"\") or \"*（缺失）*\"\n                    src = src_map.get(f.get(\"\
          source\"), \"\")\n                    req = \"✅\" if f.get(\"required_for_graph\"\
          ) else \"\"\n                    lines.append(f\"| {label} | {value} | {src}\
          \ | {req} |\")\n                facts_md = \"\\n\".join(lines)\n       \
          \     else:\n                facts_md = \"\"\n\n            return {\n \
          \               \"facts_markdown\": facts_md,\n                \"patient_info_json\"\
          : json.dumps(patient_info, ensure_ascii=False),\n                \"patient_input_structured\"\
          : d.get(\"patient_input_structured\") or \"\",\n                \"has_clear_diagnosis\"\
          : has_clear,\n                \"facts_count\": filled_count,\n         \
          \       \"need_card\": need_card,\n            }\n        if inner.get(\"\
          task_status\") in (\"failed\", \"error\"):\n            return fail\n  \
          \  return fail"
        code_language: python3
        desc: 阶段一：抽取病例 + 判断是否需要卡片
        outputs:
          facts_markdown: { children: null, type: string }
          patient_info_json: { children: null, type: string }
          patient_input_structured: { children: null, type: string }
          has_clear_diagnosis: { children: null, type: boolean }
          facts_count: { children: null, type: number }
          need_card: { children: null, type: boolean }
        selected: false
        title: 阶段一：抽取 + 预判
        type: code
        variables:
        - value_selector: ['1790458321384', query]
