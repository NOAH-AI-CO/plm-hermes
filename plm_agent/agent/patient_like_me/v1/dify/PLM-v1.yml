app:
  description: 调用 demo.noahai.co PLM v1 循证医学接口，自动轮询直到获取最终 JSON 结果
  icon: "\U0001F3E5"
  icon_background: '#E4FBCC'
  mode: workflow
  name: PLM-v1-evidence-based
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions:
      - .JPG
      - .JPEG
      - .PNG
      - .GIF
      - .WEBP
      - .SVG
      allowed_file_types:
      - image
      allowed_file_upload_methods:
      - local_file
      - remote_url
      enabled: false
      fileUploadConfig:
        attachment_image_file_size_limit: 2
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        file_upload_limit: 20
        image_file_batch_limit: 10
        image_file_size_limit: 10
        single_chunk_attachment_limit: 10
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: code
      id: start-to-submit
      selected: false
      source: '1717000000001'
      sourceHandle: source
      target: '1717000000002'
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: code
        targetType: end
      id: submit-to-end
      selected: false
      source: '1717000000002'
      sourceHandle: source
      target: '1717000000003'
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - data:
        selected: false
        title: 患者输入
        type: start
        variables:
        - default: ''
          hint: 请输入患者的详细病情描述
          label: 患者病情描述
          options: []
          placeholder: ''
          required: true
          type: paragraph
          variable: patient_input
      height: 109
      id: '1717000000001'
      position:
        x: 0
        y: 200
      positionAbsolute:
        x: 0
        y: 200
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        code: "def main(patient_input: str) -> dict:\n    import httpx\n    import\
          \ time\n    import json\n\n    API_BASE = \"https://demo.noahai.co/api\"\
          \n    TOKEN = \"237dcebf5affa113eaf563abb0cd89f3e9555683\"\n    headers =\
          \ {\n        \"Authorization\": f\"Token {TOKEN}\",\n        \"Content-Type\"\
          : \"application/json\"\n    }\n\n    resp = httpx.post(\n        f\"{API_BASE}/plm_evidence_based/\"\
          ,\n        json={\"patient_input\": patient_input},\n        headers=headers,\n\
          \        timeout=30\n    )\n    task_data = resp.json()\n    data = task_data.get(\"\
          data\", {})\n    task_id = data.get(\"task_id\", \"\")\n\n    if not task_id:\n\
          \        return {\n            \"task_id\": \"\",\n            \"task_status\"\
          : \"error\",\n            \"output\": \"\",\n            \"graph_path\":\
          \ \"\",\n            \"patient_info\": \"\",\n            \"diagnosis_clear\"\
          : \"\",\n            \"token_usage\": \"\",\n            \"retrieval_log\"\
          : \"\"\n        }\n\n    for i in range(120):\n        time.sleep(10)\n \
          \       poll_resp = httpx.get(\n            f\"{API_BASE}/execute_task/{task_id}/\"\
          ,\n            headers=headers,\n            timeout=30\n        )\n     \
          \   poll_data = poll_resp.json()\n        inner = poll_data.get(\"data\",\
          \ poll_data)\n        status = inner.get(\"task_status\", \"\")\n\n      \
          \  if status == \"complete\":\n            rj = inner.get(\"result_json\"\
          , {})\n            rd = rj.get(\"data\", rj) if isinstance(rj, dict) else\
          \ {}\n            return {\n                \"task_id\": task_id,\n      \
          \          \"task_status\": \"complete\",\n                \"output\": rd.get(\"\
          output\", \"\"),\n                \"graph_path\": rd.get(\"graph_path\", \"\"\
          ),\n                \"patient_info\": json.dumps(rd.get(\"patient_info\"\
          , {}), ensure_ascii=False),\n                \"diagnosis_clear\": json.dumps(rd.get(\"\
          diagnosis_clear\", {}), ensure_ascii=False),\n                \"token_usage\"\
          : json.dumps(rd.get(\"token_usage\", {}), ensure_ascii=False),\n        \
          \        \"retrieval_log\": json.dumps(rd.get(\"retrieval_log\", []), ensure_ascii=False)\n\
          \            }\n        elif status in (\"failed\", \"error\"):\n         \
          \   return {\n                \"task_id\": task_id,\n                \"task_status\"\
          : status,\n                \"output\": str(inner),\n                \"graph_path\"\
          : \"\",\n                \"patient_info\": \"\",\n                \"diagnosis_clear\"\
          : \"\",\n                \"token_usage\": \"\",\n                \"retrieval_log\"\
          : \"\"\n            }\n\n    return {\n        \"task_id\": task_id,\n  \
          \      \"task_status\": \"timeout\",\n        \"output\": \"\",\n       \
          \ \"graph_path\": \"\",\n        \"patient_info\": \"\",\n        \"diagnosis_clear\"\
          : \"\",\n        \"token_usage\": \"\",\n        \"retrieval_log\": \"\"\
          \n    }"
        code_language: python3
        outputs:
          task_id:
            children: null
            type: string
          task_status:
            children: null
            type: string
          output:
            children: null
            type: string
          graph_path:
            children: null
            type: string
          patient_info:
            children: null
            type: string
          diagnosis_clear:
            children: null
            type: string
          token_usage:
            children: null
            type: string
          retrieval_log:
            children: null
            type: string
        selected: false
        title: 提交并轮询
        type: code
        variables:
        - value_selector:
          - '1717000000001'
          - patient_input
          value_type: string
          variable: patient_input
      height: 52
      id: '1717000000002'
      position:
        x: 400
        y: 200
      positionAbsolute:
        x: 400
        y: 200
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        outputs:
        - value_selector:
          - '1717000000002'
          - task_id
          variable: task_id
        - value_selector:
          - '1717000000002'
          - task_status
          variable: task_status
        - value_selector:
          - '1717000000002'
          - output
          variable: output
        - value_selector:
          - '1717000000002'
          - graph_path
          variable: graph_path
        - value_selector:
          - '1717000000002'
          - patient_info
          variable: patient_info
        - value_selector:
          - '1717000000002'
          - diagnosis_clear
          variable: diagnosis_clear
        - value_selector:
          - '1717000000002'
          - token_usage
          variable: token_usage
        - value_selector:
          - '1717000000002'
          - retrieval_log
          variable: retrieval_log
        selected: false
        title: 输出结果
        type: end
      height: 250
      id: '1717000000003'
      position:
        x: 800
        y: 200
      positionAbsolute:
        x: 800
        y: 200
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
  viewport:
    x: 100
    y: 100
    zoom: 0.8
  rag_pipeline_variables: []
