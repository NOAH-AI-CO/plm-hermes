app:
  description: PLM 循证医学接口（开始 → extract 拿卡片 → 人工介入确认 → 主接口出报告；含药物说明书段）
  icon: 🧑‍⚕️
  icon_background: '#E4FBCC'
  mode: workflow
  name: PLM-v1-with-card
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions:
      - .JPG
      - .JPEG
      - .PNG
      - .GIF
      - .WEBP
      - .SVG
      allowed_file_types:
      - image
      allowed_file_upload_methods:
      - local_file
      - remote_url
      enabled: false
      fileUploadConfig:
        attachment_image_file_size_limit: 2
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        file_upload_limit: 20
        image_file_batch_limit: 10
        image_file_size_limit: 10
        single_chunk_attachment_limit: 10
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: ''
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: code
      id: start-to-extract
      source: '1790458321384'
      sourceHandle: source
      target: '1790458322001'
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: code
        targetType: human-input
      id: extract-to-human
      source: '1790458322001'
      sourceHandle: source
      target: '1790458324939'
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: human-input
        targetType: code
      id: human-to-final
      source: '1790458324939'
      sourceHandle: source
      target: '1790458322002'
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: code
        targetType: end
      id: final-to-end
      source: '1790458322002'
      sourceHandle: source
      target: '1790458322003'
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - data:
        selected: false
        title: 开始
        type: start
        variables:
        - default: ''
          hint: 输入患者完整病情描述
          label: 患者病情描述
          options: []
          placeholder: ''
          required: true
          type: paragraph
          variable: patient_input
      height: 90
      id: '1790458321384'
      position:
        x: 80
        y: 282
      positionAbsolute:
        x: 80
        y: 282
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        code: "def main(patient_input: str) -> dict:\n    import httpx\n    import\
          \ time\n    import json\n\n    API_BASE = \"https://demo.noahai.co/api\"\
          \n    TOKEN = \"3771967bfca7de823440b93c29c0fa04f0c8e1a2\"\n    headers\
          \ = {\"Authorization\": f\"Token {TOKEN}\", \"Content-Type\": \"application/json\"\
          }\n\n    empty = {\n        \"facts_markdown\": \"\",\n        \"facts_json\"\
          : \"\",\n        \"patient_info_json\": \"\",\n        \"patient_input_structured\"\
          : \"\",\n        \"has_missing_required\": False,\n        \"error\": \"\
          \",\n    }\n\n    try:\n        resp = httpx.post(\n            f\"{API_BASE}/plm_evidence_based/extract-and-check/\"\
          ,\n            json={\"patient_input\": patient_input},\n            headers=headers,\n\
          \            timeout=30,\n        )\n        task_id = resp.json().get(\"\
          data\", {}).get(\"task_id\")\n    except Exception as exc:\n        empty[\"\
          error\"] = f\"提交失败: {exc}\"\n        return empty\n    if not task_id:\n\
          \        empty[\"error\"] = \"未获取到 task_id\"\n        return empty\n\n \
          \   for _ in range(60):\n        time.sleep(5)\n        try:\n         \
          \   poll = httpx.get(f\"{API_BASE}/execute_task/{task_id}/\", headers=headers,\
          \ timeout=30)\n            inner = poll.json().get(\"data\", {})\n     \
          \   except Exception as exc:\n            empty[\"error\"] = f\"轮询失败: {exc}\"\
          \n            return empty\n        status = inner.get(\"task_status\",\
          \ \"\")\n        if status == \"complete\":\n            rj = inner.get(\"\
          result_json\", {})\n            if isinstance(rj, str):\n              \
          \  rj = json.loads(rj)\n            d = rj.get(\"data\", {})\n         \
          \   if isinstance(d, str):\n                d = json.loads(d)\n        \
          \    facts = d.get(\"facts\") or []\n            if facts:\n           \
          \     src_map = {\"user_input\": \"人工输入\", \"system_extracted\": \"图谱提取\"\
          , \"missing\": \"未填写\"}\n                lines = [\"| 字段 | 当前值 | 来源 | 必填\
          \ |\", \"|---|---|---|---|\"]\n                for f in facts:\n      \
          \              label = f.get(\"label\", \"\") or f.get(\"key\", \"\")\n\
          \                    value = f.get(\"value\", \"\") or \"*（缺失）*\"\n   \
          \                 src = src_map.get(f.get(\"source\"), f.get(\"source\"\
          ) or \"\")\n                    req = \"✅\" if f.get(\"required_for_graph\"\
          ) else \"\"\n                    lines.append(f\"| {label} | {value} |\
          \ {src} | {req} |\")\n                facts_md = \"\\n\".join(lines)\n \
          \           else:\n                facts_md = \"（未抽取到任何字段）\"\n         \
          \   return {\n                \"facts_markdown\": facts_md,\n          \
          \      \"facts_json\": json.dumps(facts, ensure_ascii=False),\n        \
          \        \"patient_info_json\": json.dumps(d.get(\"patient_info\") or {},\
          \ ensure_ascii=False),\n                \"patient_input_structured\": d.get(\"\
          patient_input_structured\") or \"\",\n                \"has_missing_required\"\
          : bool(d.get(\"has_missing_required\")),\n                \"error\": \"\
          \",\n            }\n        if status in (\"failed\", \"error\"):\n   \
          \         empty[\"error\"] = \"抽取任务失败\"\n            return empty\n    empty[\"\
          error\"] = \"抽取轮询超时\"\n    return empty"
        code_language: python3
        outputs:
          facts_markdown:
            children: null
            type: string
          facts_json:
            children: null
            type: string
          patient_info_json:
            children: null
            type: string
          patient_input_structured:
            children: null
            type: string
          has_missing_required:
            children: null
            type: boolean
          error:
            children: null
            type: string
        selected: false
        title: 阶段一：抽取病例
        type: code
        variables:
        - value_selector:
          - '1790458321384'
          - patient_input
          value_type: string
          variable: patient_input
      height: 52
      id: '1790458322001'
      position:
        x: 382
        y: 282
      positionAbsolute:
        x: 382
        y: 282
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        delivery_methods:
        - type: webapp
          enabled: true
          config: {}
        form_content: |
          ## 请核对自动抽取的病例信息

          {{#1790458322001.facts_markdown#}}

          如有需要，请在下方按 `字段: 值` 的格式补充或修改（每行一项；保持原样则留空）：
        inputs:
        - type: paragraph
          output_variable_name: user_edits
        selected: false
        timeout: 3
        timeout_unit: day
        title: 人工介入：确认卡片
        type: human-input
        user_actions:
        - id: confirm
          title: 确认并继续
          button_style: primary
      height: 84
      id: '1790458324939'
      position:
        x: 684
        y: 282
      positionAbsolute:
        x: 684
        y: 282
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        code: "def main(patient_input: str, patient_info_json: str, patient_input_structured:\
          \ str, user_edits: str) -> dict:\n    import httpx\n    import time\n  \
          \  import json\n    import re\n\n    API_BASE = \"https://demo.noahai.co/api\"\
          \n    TOKEN = \"3771967bfca7de823440b93c29c0fa04f0c8e1a2\"\n    headers\
          \ = {\"Authorization\": f\"Token {TOKEN}\", \"Content-Type\": \"application/json\"\
          }\n\n    structured_fields = {}\n    if user_edits and user_edits.strip():\n\
          \        for raw in re.split(r\"[\\n；;]\", user_edits):\n            line\
          \ = raw.strip().strip(\"`\").strip()\n            if not line:\n       \
          \         continue\n            m = re.match(r\"^([^:：=]+)\\s*[:：=]\\s*(.+)$\"\
          , line)\n            if m:\n                k = m.group(1).strip()\n   \
          \             v = m.group(2).strip()\n                if k and v:\n    \
          \                structured_fields[k] = v\n\n    body = {\"patient_input\"\
          : patient_input}\n    if patient_info_json:\n        try:\n            body[\"\
          confirmed_patient_info\"] = json.loads(patient_info_json)\n        except\
          \ Exception:\n            pass\n    if patient_input_structured:\n     \
          \   body[\"patient_input_structured\"] = patient_input_structured\n    if\
          \ structured_fields:\n        body[\"structured_fields\"] = structured_fields\n\
          \n    try:\n        resp = httpx.post(\n            f\"{API_BASE}/plm_evidence_based/\"\
          ,\n            json=body,\n            headers=headers,\n            timeout=30,\n\
          \        )\n        task_id = resp.json().get(\"data\", {}).get(\"task_id\"\
          )\n    except Exception as exc:\n        return {\"result\": f\"错误：提交失败:\
          \ {exc}\"}\n    if not task_id:\n        return {\"result\": \"错误：未获取到 task_id\"\
          }\n\n    for _ in range(120):\n        time.sleep(10)\n        try:\n  \
          \          poll = httpx.get(f\"{API_BASE}/execute_task/{task_id}/\", headers=headers,\
          \ timeout=30)\n            inner = poll.json().get(\"data\", {})\n     \
          \   except Exception as exc:\n            return {\"result\": f\"错误：轮询失败:\
          \ {exc}\"}\n        status = inner.get(\"task_status\", \"\")\n        if\
          \ status == \"complete\":\n            rj = inner.get(\"result_json\",\
          \ {})\n            if isinstance(rj, str):\n                rj = json.loads(rj)\n\
          \            d = rj.get(\"data\", {})\n            if isinstance(d, str):\n\
          \                d = json.loads(d)\n            route = d.get(\"route\"\
          ) or \"\"\n            output = d.get(\"output\") or \"\"\n            if\
          \ route == \"insufficient_case\":\n                mi = d.get(\"missing_information\"\
          ) or []\n                if mi:\n                    output = (output or\
          \ \"病例信息不足以给出安全建议。\") + \"\\n\\n建议补充：\" + \"、\".join(mi)\n            return\
          \ {\"result\": output or \"无输出内容\"}\n        if status in (\"failed\", \"\
          error\"):\n            return {\"result\": \"错误：诊疗任务失败\"}\n\n    return {\"\
          result\": \"错误：轮询超时（1200s）\"}"
        code_language: python3
        outputs:
          result:
            children: null
            type: string
        selected: false
        title: 阶段二：提交主接口
        type: code
        variables:
        - value_selector:
          - '1790458321384'
          - patient_input
          value_type: string
          variable: patient_input
        - value_selector:
          - '1790458322001'
          - patient_info_json
          value_type: string
          variable: patient_info_json
        - value_selector:
          - '1790458322001'
          - patient_input_structured
          value_type: string
          variable: patient_input_structured
        - value_selector:
          - '1790458324939'
          - user_edits
          value_type: string
          variable: user_edits
      height: 52
      id: '1790458322002'
      position:
        x: 986
        y: 282
      positionAbsolute:
        x: 986
        y: 282
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        outputs:
        - value_selector:
          - '1790458322002'
          - result
          variable: result
        selected: false
        title: 输出
        type: end
      height: 88
      id: '1790458322003'
      position:
        x: 1288
        y: 282
      positionAbsolute:
        x: 1288
        y: 282
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    viewport:
      x: 0
      y: 1
      zoom: 0.85
  rag_pipeline_variables: []
