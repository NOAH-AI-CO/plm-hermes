"Dataset": "Dataset"
"Technical Report": "Technical Report"

# 直接过滤或强降权
"Retracted Publication": "Retracted Publication"
"Retraction Notice": "Retraction Notice"
"Published Erratum": "Published Erratum"                 # 常规降权
"Expression of Concern": "Expression of Concern"         # 强降权
"Corrected and Republished Article": "Corrected and Republished Article"  # 轻微降权
"Retraction of Publication": "Retraction Notice"         # 归并到 Retraction Notice

# 兽医（强降权）
"Randomized Controlled Trial, Veterinary": "Randomized Controlled Trial, Veterinary"
