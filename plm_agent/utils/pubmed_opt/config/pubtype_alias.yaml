# pubtype_alias.yaml

"Systematic Review": "Systematic Review"
"Meta-Analysis": "Meta-Analysis"
"Network Meta-Analysis": "Network Meta-Analysis"
"Scoping Review": "Systematic Review"            # 常作为系统综述的变体，按需可单独设权重

# RCT / 临床试验
"Randomized Controlled Trial": "Randomized Controlled Trial"
"Controlled Clinical Trial": "Randomized Controlled Trial"  # 老标签，等同或近似RCT
"Pragmatic Clinical Trial": "Pragmatic Clinical Trial"
"Equivalence Trial": "Equivalence Trial"
"Clinical Trial": "Clinical Trial"
"Clinical Trial, Phase I": "Clinical Trial, Phase I"
"Clinical Trial, Phase II": "Clinical Trial, Phase II"
"Clinical Trial, Phase III": "Clinical Trial, Phase III"
"Clinical Trial, Phase IV": "Clinical Trial, Phase IV"
"Adaptive Clinical Trial": "Clinical Trial"       # 可细分；先并入临床试验
"Clinical Trial Protocol": "Clinical Trial Protocol"  # 协议类通常不做高权

# 指南/共识
"Practice Guideline": "Practice Guideline"
"Guideline": "Guideline"
"Consensus Development Conference": "Consensus Development Conference"
"Consensus Development Conference, NIH": "Consensus Development Conference, NIH"

# 观察性/多中心/验证
"Observational Study": "Observational Study"
"Multicenter Study": "Multicenter Study"
"Validation Study": "Validation Study"
"Comparative Study": "Comparative Study"
"Clinical Study": "Observational Study"  # 宽泛标签，先归并到观察性

# 信息性/体裁
"Case Reports": "Case Reports"
"Editorial": "Editorial"
"Letter": "Letter"
"News": "News"
"Preprint": "Preprint"
